<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BATTLE AGAINST A TRUE HERO · Pixel MV</title>
<link rel="icon" href="favicon.svg">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: monospace; }
  #mv { display: block; image-rendering: pixelated; background: #000; }
  #ui { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
        color: #fff; cursor: pointer; background: rgba(0,0,0,.55); letter-spacing: 2px; transition: opacity .2s; }
  #ui.hide { opacity: 0; pointer-events: none; }
  #ui .t { font-size: 28px; color: #00e040; border: 3px solid #00e040; padding: 10px 26px; }
  #ui .s { margin-top: 14px; font-size: 12px; color: #999; }
  #timeline { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: #111; cursor: pointer; }
  #bar { height: 100%; width: 0; background: #2a6bff; }
  #info { position: fixed; top: 6px; left: 8px; color: #0f0; font-size: 12px; display: none; }
  #info.show { display: block; }
</style>
</head>
<body>
<canvas id="mv" width="1920" height="1080"></canvas>
<audio id="audio" src="music.mp3" preload="auto"></audio>
<div id="ui"><div class="t">♥ 战斗 · PLAY</div><div class="s">SPACE / Z 播放暂停 · ←/→ 快退快进 · D 调试信息 · 点击底部进度条跳转</div></div>
<div id="timeline"><div id="bar"></div></div>
<div id="info"></div>
